<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="theme-color" content="#141414">
    <title>CineStream - Plataforma de Películas</title>
    <style>
        :root {
            --primary: #e50914;
            --dark: #141414;
            --darker: #0a0a0a;
            --card-bg: #1a1a1a;
            --text: #ffffff;
            --text-muted: #b3b3b3;
            --gradient: linear-gradient(135deg, #e50914 0%, #ff6b6b 100%);
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            scroll-behavior: smooth;
            -webkit-text-size-adjust: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: var(--dark);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            touch-action: manipulation;
            -webkit-overflow-scrolling: touch;
        }

        .background-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(229, 9, 20, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(229, 9, 20, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 50% 80%, rgba(229, 9, 20, 0.08) 0%, transparent 50%);
            animation: backgroundShift 10s ease-in-out infinite;
            z-index: 0;
            pointer-events: none;
        }

        @keyframes backgroundShift {
            0%, 100% { transform: translateY(0) scale(1); }
            25% { transform: translateY(-20px) scale(1.05); }
            50% { transform: translateY(-10px) scale(1.02); }
            75% { transform: translateY(-30px) scale(1.08); }
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 15px;
        }

        .header {
            background: rgba(20, 20, 20, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 12px 0;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 15px;
            gap: 10px;
            flex-wrap: wrap;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: var(--primary);
            text-decoration: none;
            letter-spacing: 2px;
            cursor: pointer;
            user-select: none;
            flex-shrink: 0;
        }

        .nav-menu {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            flex: 1;
        }

        .nav-link {
            color: var(--text);
            text-decoration: none;
            padding: 10px 15px;
            border-radius: 25px;
            transition: var(--transition);
            cursor: pointer;
            font-size: 16px;
            min-height: 44px;
            display: flex;
            align-items: center;
            white-space: nowrap;
        }

        .nav-link:hover,
        .nav-link:focus {
            background: var(--primary);
            transform: translateY(-2px);
            outline: none;
        }

        .search-bar {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid transparent;
            border-radius: 25px;
            padding: 12px 20px;
            color: var(--text);
            width: 200px;
            font-size: 16px;
            min-height: 44px;
            outline: none;
            flex-shrink: 1;
            min-width: 120px;
        }

        .search-bar:focus {
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.15);
            width: 250px;
        }

        .search-bar::placeholder {
            color: var(--text-muted);
        }

        .hero {
            height: 300px;
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.3)), url('https://image.tmdb.org/t/p/w1280/4XM8DUTQb3lhLemJC51Jx4a2EuA.jpg');
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            border-radius: 10px;
            margin: 20px 0;
            position: relative;
            overflow: hidden;
        }

        .hero-content {
            padding: 30px;
            max-width: 600px;
            width: 100%;
        }

        .hero-title {
            font-size: 36px;
            margin-bottom: 15px;
        }

        .hero-description {
            font-size: 16px;
            margin-bottom: 20px;
            color: #d3d3d3;
        }

        .btn {
            display: inline-block;
            padding: 14px 28px;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            min-height: 48px;
            user-select: none;
            text-decoration: none;
            transition: var(--transition);
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: #ff1a1a;
            transform: translateY(-3px);
        }

        .section-title {
            font-size: 24px;
            margin: 30px 0 15px;
            padding-bottom: 10px;
            border-bottom: 3px solid var(--primary);
            display: inline-block;
        }

        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            padding: 15px 0;
        }

        .movie-card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            transition: var(--transition);
            cursor: pointer;
            outline: 2px solid transparent;
            position: relative;
        }

        .movie-card:hover,
        .movie-card:focus {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.7);
            outline-color: var(--primary);
        }

        /* CONTENEDOR DE IMAGEN - SOLUCIÓN PARA MÓVILES */
        .movie-poster-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 148%; /* Proporción 2:3 para posters */
            overflow: hidden;
            background: #1a1a1a;
        }

        .movie-poster {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            display: block;
            background: #1a1a1a;
        }

        .movie-info {
            padding: 12px;
        }

        .movie-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 6px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.3;
        }

        .movie-rating {
            color: #ffd700;
            font-size: 14px;
        }

        .movie-genre {
            color: #888;
            font-size: 12px;
            margin-top: 5px;
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 2000;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 20px;
        }

        .modal-content {
            position: relative;
            width: 95%;
            max-width: 900px;
            margin: 20px auto;
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
        }

        .close-modal {
            position: fixed;
            top: 20px;
            right: 20px;
            font-size: 35px;
            color: var(--text);
            cursor: pointer;
            z-index: 2100;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid rgba(255, 255, 255, 0.3);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            line-height: 1;
        }

        .close-modal:hover {
            color: var(--primary);
            transform: rotate(90deg);
            border-color: var(--primary);
        }

        .modal-details {
            padding: 25px;
            background: linear-gradient(to bottom, #1a1a1a, #0a0a0a);
        }

        .modal-title {
            font-size: 28px;
            margin-bottom: 12px;
            padding-right: 60px;
        }

        .modal-meta {
            display: flex;
            gap: 15px;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }

        .modal-meta-item {
            color: var(--text-muted);
            font-size: 14px;
        }

        .modal-description {
            font-size: 16px;
            line-height: 1.6;
            color: var(--text-muted);
            margin-bottom: 25px;
        }

        .info-adicional {
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
        }

        .info-adicional h3 {
            color: #e50914;
            margin-bottom: 10px;
            font-size: 18px;
        }

        .info-adicional p {
            margin-bottom: 8px;
            font-size: 14px;
        }

        .info-adicional p:last-child {
            margin-bottom: 0;
        }

        .video-container {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            background: #000;
            margin-top: 20px;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .temporadas-container {
            margin-top: 25px;
        }

        .temporadas-container h3 {
            color: #e50914;
            margin-bottom: 15px;
            font-size: 20px;
        }

        .temporada-section {
            margin-bottom: 15px;
        }

        .temporada-header {
            background: rgba(229, 9, 20, 0.1);
            border: 1px solid rgba(229, 9, 20, 0.3);
            border-radius: 10px;
            padding: 15px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: var(--transition);
            user-select: none;
        }

        .temporada-header:hover {
            background: rgba(229, 9, 20, 0.2);
        }

        .temporada-title {
            font-size: 18px;
            font-weight: bold;
            color: var(--primary);
        }

        .temporada-info {
            color: var(--text-muted);
        }

        .capitulos-container {
            display: none;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 0 0 10px 10px;
            margin-top: 5px;
        }

        .capitulos-container.activo {
            display: block;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .capitulo-item {
            display: flex;
            align-items: center;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: var(--transition);
            gap: 12px;
        }

        .capitulo-item:hover {
            background: rgba(229, 9, 20, 0.2);
            transform: translateX(5px);
        }

        .capitulo-numero-badge {
            background: var(--primary);
            color: white;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            flex-shrink: 0;
        }

        .capitulo-info {
            flex: 1;
        }

        .capitulo-nombre {
            font-size: 15px;
            font-weight: 500;
            color: var(--text);
        }

        .capitulo-duracion {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 3px;
        }

        .btn-volver {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            transition: var(--transition);
            margin-bottom: 15px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-volver:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateX(-5px);
        }

        .sin-resultados {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
            font-size: 18px;
            grid-column: 1 / -1;
        }

        /* RESPONSIVE - MEJORADO PARA MÓVILES */
        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                gap: 10px;
                align-items: stretch;
                padding: 0 10px;
            }
            
            .logo {
                text-align: center;
                font-size: 28px;
            }
            
            .nav-menu {
                justify-content: center;
                gap: 5px;
                flex-wrap: wrap;
            }
            
            .nav-link {
                font-size: 14px;
                padding: 8px 12px;
                min-height: 40px;
            }
            
            .search-bar {
                width: 100%;
                font-size: 14px;
            }
            
            .search-bar:focus {
                width: 100%;
            }
            
            .hero {
                height: 250px;
                margin: 15px 0;
            }
            
            .hero-title {
                font-size: 28px;
            }
            
            .hero-content {
                padding: 20px;
            }
            
            .movie-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 15px;
                padding: 10px 0;
            }

            /* Ajuste de altura para móviles */
            .movie-poster-wrapper {
                padding-bottom: 140%;
            }
            
            .modal-content {
                margin: 10px auto;
                width: 98%;
            }
            
            .modal-title {
                font-size: 22px;
                padding-right: 50px;
            }
            
            .modal-details {
                padding: 15px;
            }
            
            .close-modal {
                top: 10px;
                right: 10px;
                width: 40px;
                height: 40px;
                font-size: 28px;
            }

            .modal {
                padding: 10px;
            }
        }

        @media (max-width: 480px) {
            .movie-grid {
                grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
                gap: 10px;
            }

            .movie-poster-wrapper {
                padding-bottom: 145%;
            }
            
            .movie-title {
                font-size: 14px;
            }
            
            .hero {
                height: 200px;
            }
            
            .hero-title {
                font-size: 24px;
            }
            
            .section-title {
                font-size: 20px;
            }

            .nav-link {
                font-size: 12px;
                padding: 6px 10px;
                min-height: 36px;
            }
        }

        @media (max-width: 360px) {
            .movie-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 8px;
            }

            .movie-poster-wrapper {
                padding-bottom: 150%;
            }

            .movie-info {
                padding: 8px;
            }

            .movie-title {
                font-size: 12px;
            }

            .movie-rating {
                font-size: 11px;
            }

            .movie-genre {
                font-size: 10px;
            }
        }

        @media (min-width: 769px) {
            .movie-poster-wrapper {
                padding-bottom: 148%;
            }
        }
    </style>
</head>

            {

                poster: "https://image.tmdb.org/t/p/w600_and_h900_face/iQ5ztdjvteGeboUtKPvHvZbfsS2.jpg",
                rating: "8.3",
                anio: 1983,
                duracion: "2h 50min",
                genero: "Crimen, Drama",
                descripcion: "Un inmigrante cubano se convierte en un poderoso narcotraficante en Miami.",
                director: "Brian De Palma",
                reparto: "Al Pacino, Michelle Pfeiffer, Steven Bauer",
                embedUrl: "https://www.youtube.com/embed/5p0QtJMKt1s"
            },
            {
                titulo: "Rocky",
                poster: "https://image.tmdb.org/t/p/w600_and_h900_face/4siT5c8pxT9f6JXQvT7cD7XQ9Jt.jpg",
                rating: "8.1",
                anio: 1976,
                duracion: "2h 0min",
                genero: "Drama, Deportes",
                descripcion: "Un boxeador de poca monta tiene la oportunidad de luchar por el título mundial.",
                director: "John G. Avildsen",
                reparto: "Sylvester Stallone, Talia Shire, Burt Young",
                embedUrl: "https://www.youtube.com/embed/7RYpJAUMo2M"
            }
        ];

        // Base de datos de series
        const series = [
            {
                titulo: "Breaking Bad",
                poster: "https://image.tmdb.org/t/p/w500/ggFHVNu6YYI5L9pCfOacjizRGt.jpg",
                rating: "9.5",
                anio: 2008,
                genero: "Drama, Crimen, Thriller",
                descripcion: "Un profesor de química diagnosticado con cáncer terminal se asocia con un exalumno para fabricar y vender metanfetamina.",
                creador: "Vince Gilligan",
                reparto: "Bryan Cranston, Aaron Paul, Anna Gunn",
                temporadas: [
                    {
                        numero: 1,
                        anio: 2008,
                        capitulos: [
                            { numero: 1, nombre: "Piloto", duracion: "58 min", embedUrl: "https://www.youtube.com/embed/BREAKING_BAD_T1_E1" },
                            { numero: 2, nombre: "El gato en la bolsa", duracion: "48 min", embedUrl: "https://www.youtube.com/embed/BREAKING_BAD_T1_E2" },
                            { numero: 3, nombre: "...Y la bolsa en el río", duracion: "48 min", embedUrl: "https://www.youtube.com/embed/BREAKING_BAD_T1_E3" },
                            { numero: 4, nombre: "Hombre con cáncer", duracion: "48 min", embedUrl: "https://www.youtube.com/embed/BREAKING_BAD_T1_E4" },
                            { numero: 5, nombre: "Materia gris", duracion: "48 min", embedUrl: "https://www.youtube.com/embed/BREAKING_BAD_T1_E5" },
                            { numero: 6, nombre: "Locura de mercado", duracion: "47 min", embedUrl: "https://www.youtube.com/embed/BREAKING_BAD_T1_E6" },
                            { numero: 7, nombre: "Trato no violento", duracion: "47 min", embedUrl: "https://www.youtube.com/embed/BREAKING_BAD_T1_E7" }
                        ]
                    }
                ]
            },
            {
                titulo: "Stranger Things",
                poster: "https://image.tmdb.org/t/p/w500/49WJfeN0moxb9IPfGn8AIqMGskD.jpg",
                rating: "8.7",
                anio: 2016,
                genero: "Ciencia Ficción, Terror, Drama",
                descripcion: "Cuando un niño desaparece, sus amigos y familia se ven envueltos en eventos sobrenaturales.",
                creador: "The Duffer Brothers",
                reparto: "Millie Bobby Brown, Finn Wolfhard, David Harbour",
                temporadas: [
                    {
                        numero: 1,
                        anio: 2016,
                        capitulos: [
                            { numero: 1, nombre: "La desaparición de Will Byers", duracion: "48 min", embedUrl: "https://www.youtube.com/embed/STRANGER_THINGS_T1_E1" },
                            { numero: 2, nombre: "La loca de Maple Street", duracion: "56 min", embedUrl: "https://www.youtube.com/embed/STRANGER_THINGS_T1_E2" },
                            { numero: 3, nombre: "Todo está bien", duracion: "52 min", embedUrl: "https://www.youtube.com/embed/STRANGER_THINGS_T1_E3" },
                            { numero: 4, nombre: "El cuerpo", duracion: "50 min", embedUrl: "https://www.youtube.com/embed/STRANGER_THINGS_T1_E4" },
                            { numero: 5, nombre: "La pulga y el acróbata", duracion: "53 min", embedUrl: "https://www.youtube.com/embed/STRANGER_THINGS_T1_E5" },
                            { numero: 6, nombre: "El monstruo", duracion: "47 min", embedUrl: "https://www.youtube.com/embed/STRANGER_THINGS_T1_E6" },
                            { numero: 7, nombre: "La bañera", duracion: "42 min", embedUrl: "https://www.youtube.com/embed/STRANGER_THINGS_T1_E7" },
                            { numero: 8, nombre: "El otro lado", duracion: "55 min", embedUrl: "https://www.youtube.com/embed/STRANGER_THINGS_T1_E8" }
                        ]
                    }
                ]
            }
        ];

        let serieActual = null;

        function crearTarjeta(item) {
            const card = document.createElement('div');
            card.className = 'movie-card';
            card.tabIndex = 0;
            card.setAttribute('role', 'button');
            card.setAttribute('aria-label', `Ver ${item.titulo}`);
            
            card.onclick = function() { openModal(item); };
            card.onkeydown = function(e) {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    openModal(item);
                }
            };
            
            const generoMostrado = Array.isArray(item.genero) ? item.genero.join(', ') : item.genero;
            
            card.innerHTML = `
                <div class="movie-poster-wrapper">
                    <img src="${item.poster}" alt="${item.titulo}" class="movie-poster" 
                         onerror="this.src='https://via.placeholder.com/250x370/333333/ffffff?text=${encodeURIComponent(item.titulo)}'">
                </div>
                <div class="movie-info">
                    <h3 class="movie-title">${item.titulo}</h3>
                    <p class="movie-rating">⭐ ${item.rating} | ${item.anio}</p>
                    <p class="movie-genre">${generoMostrado || ''}</p>
                </div>
            `;
            
            return card;
        }

        function cargarPeliculas() {
            const movieGrid = document.getElementById('movieGrid');
            const terrorGrid = document.getElementById('terrorGrid');
            const seriesGrid = document.getElementById('seriesGrid');

            // Limpiar grids
            movieGrid.innerHTML = '';
            terrorGrid.innerHTML = '';
            seriesGrid.innerHTML = '';

            // Películas
            peliculas.forEach(pelicula => {
                const esTerror = typeof pelicula.genero === 'string' &&
                    pelicula.genero.toLowerCase().includes('terror');

                if (esTerror) {
                    terrorGrid.appendChild(crearTarjeta(pelicula));
                } else {
                    movieGrid.appendChild(crearTarjeta(pelicula));
                }
            });

            // Series
            series.forEach(serie => {
                seriesGrid.appendChild(crearTarjeta(serie));
            });
        }

        function openModal(item) {
            const modal = document.getElementById('videoModal');
            const modalBody = document.getElementById('modalBody');
            
            if (item.temporadas && item.temporadas.length > 0) {
                serieActual = item;
                mostrarSerie(item, modalBody);
            } else {
                mostrarPelicula(item, modalBody);
            }
            
            modal.style.display = 'block';
            document.body.style.overflow = 'hidden';
            modal.scrollTop = 0;
        }

        function mostrarPelicula(pelicula, contenedor) {
            const generoMostrado = Array.isArray(pelicula.genero) ? pelicula.genero.join(', ') : pelicula.genero;
            
            contenedor.innerHTML = `
                <div class="modal-details">
                    <h2 class="modal-title">${pelicula.titulo}</h2>
                    <div class="modal-meta">
                        <span class="modal-meta-item">⭐ ${pelicula.rating}</span>
                        <span class="modal-meta-item">📅 ${pelicula.anio}</span>
                        <span class="modal-meta-item">⏱️ ${pelicula.duracion}</span>
                        <span class="modal-meta-item">🎭 ${generoMostrado}</span>
                    </div>
                    <p class="modal-description">${pelicula.descripcion}</p>
                    
                    <div class="info-adicional">
                        <h3>Información Adicional</h3>
                        <p><strong>Director:</strong> ${pelicula.director}</p>
                        <p><strong>Reparto:</strong> ${pelicula.reparto}</p>
                    </div>
                    
                    <div class="video-container">
                        <iframe src="${pelicula.embedUrl}" 
                                frameborder="0" 
                                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                                allowfullscreen>
                        </iframe>
                    </div>
                </div>
            `;
        }

        function mostrarSerie(serie, contenedor) {
            contenedor.innerHTML = `
                <div class="modal-details">
                    <h2 class="modal-title">${serie.titulo}</h2>
                    <div class="modal-meta">
                        <span class="modal-meta-item">⭐ ${serie.rating}</span>
                        <span class="modal-meta-item">📅 ${serie.anio}</span>
                        <span class="modal-meta-item">🎭 ${serie.genero}</span>
                        <span class="modal-meta-item">📺 ${serie.temporadas.length} Temporadas</span>
                    </div>
                    <p class="modal-description">${serie.descripcion}</p>
                    
                    <div class="info-adicional">
                        <h3>Información Adicional</h3>
                        <p><strong>Creador:</strong> ${serie.creador}</p>
                        <p><strong>Reparto:</strong> ${serie.reparto}</p>
                    </div>
                    
                    <div class="temporadas-container">
                        <h3>📋 Temporadas y Capítulos</h3>
                        ${serie.temporadas.map(temporada => `
                            <div class="temporada-section">
                                <div class="temporada-header" onclick="toggleCapitulos(${temporada.numero})">
                                    <span class="temporada-title">Temporada ${temporada.numero} (${temporada.anio})</span>
                                    <span class="temporada-info">${temporada.capitulos.length} capítulos ▼</span>
                                </div>
                                <div class="capitulos-container" id="capitulos-${temporada.numero}">
                                    ${temporada.capitulos.map(capitulo => `
                                        <div class="capitulo-item" onclick="reproducirCapitulo(${temporada.numero}, ${capitulo.numero})">
                                            <div class="capitulo-numero-badge">${capitulo.numero}</div>
                                            <div class="capitulo-info">
                                                <div class="capitulo-nombre">${capitulo.nombre}</div>
                                                <div class="capitulo-duracion">⏱️ ${capitulo.duracion}</div>
                                            </div>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function toggleCapitulos(numeroTemporada) {
            const contenedor = document.getElementById(`capitulos-${numeroTemporada}`);
            if (contenedor) {
                contenedor.classList.toggle('activo');
            }
        }

        function reproducirCapitulo(numeroTemporada, numeroCapitulo) {
            if (!serieActual) return;
            
            const temporada = serieActual.temporadas.find(t => t.numero === numeroTemporada);
            if (!temporada) return;
            
            const capitulo = temporada.capitulos.find(c => c.numero === numeroCapitulo);
            if (!capitulo) return;
            
            const modalBody = document.getElementById('modalBody');
            
            modalBody.innerHTML = `
                <div class="modal-details">
                    <button class="btn-volver" onclick="volverASerie()">← Volver a la serie</button>
                    
                    <h2 class="modal-title">${serieActual.titulo}</h2>
                    <p style="color: var(--primary); font-size: 18px; margin-bottom: 20px;">
                        Temporada ${numeroTemporada} - Episodio ${numeroCapitulo}: ${capitulo.nombre}
                    </p>
                    
                    <div class="video-container">
                        <iframe src="${capitulo.embedUrl}" 
                                frameborder="0" 
                                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                                allowfullscreen>
                        </iframe>
                    </div>
                </div>
            `;
            
            document.getElementById('videoModal').scrollTop = 0;
        }

        function volverASerie() {
            if (!serieActual) return;
            
            const modalBody = document.getElementById('modalBody');
            mostrarSerie(serieActual, modalBody);
            
            document.getElementById('videoModal').scrollTop = 0;
        }

        function closeModal() {
            const modal = document.getElementById('videoModal');
            const modalBody = document.getElementById('modalBody');
            
            modalBody.innerHTML = '';
            modal.style.display = 'none';
            document.body.style.overflow = 'auto';
            serieActual = null;
        }

        // Event Listeners
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                closeModal();
            }
        });

        document.getElementById('videoModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });

        document.querySelector('.search-bar').addEventListener('input', function(e) {
            const searchTerm = e.target.value.toLowerCase().trim();
            const allCards = document.querySelectorAll('.movie-card');
            
            allCards.forEach(card => {
                const title = card.querySelector('.movie-title')?.textContent.toLowerCase() || '';
                const genre = card.querySelector('.movie-genre')?.textContent.toLowerCase() || '';
                
                if (title.includes(searchTerm) || genre.includes(searchTerm) || searchTerm === '') {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });

            // Mostrar mensaje si no hay resultados
            const grids = document.querySelectorAll('.movie-grid');
            grids.forEach(grid => {
                const mensajeExistente = grid.querySelector('.sin-resultados');
                const cardsVisibles = grid.querySelectorAll('.movie-card[style*="display: block"]');
                
                if (cardsVisibles.length === 0 && searchTerm !== '') {
                    if (!mensajeExistente) {
                        const mensaje = document.createElement('div');
                        mensaje.className = 'sin-resultados';
                        mensaje.textContent = `No se encontraron resultados para "${searchTerm}"`;
                        grid.appendChild(mensaje);
                    }
                } else {
                    if (mensajeExistente) {
                        mensajeExistente.remove();
                    }
                }
            });
        });

        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({ behavior: 'smooth' });
                }
            });
        });

        // Inicializar
        window.addEventListener('DOMContentLoaded', cargarPeliculas);
    </script>
</body>
